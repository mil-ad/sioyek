name: Supernote Release

# Builds the Supernote-enabled fork and publishes a GitHub Release.
# Release assets never expire, unlike workflow artifacts (90 days).
# Trigger by pushing a tag like `supernote-v1`, or manually from the Actions tab.

on:
  push:
    tags:
      - "supernote-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        modules: 'all'
        cache: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Add msvc-dev-cmd
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build Sioyek
      run: .\build_windows.bat portable

    - name: Upload windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: sioyek-release-windows-portable.zip

  build-mac-arm:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: brew install freeglut mesa harfbuzz

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        modules: 'all'
        cache: true

    - name: Build
      run: |
        chmod +x build_mac.sh
        MAKE_PARALLEL=$(sysctl -n hw.logicalcpu) ./build_mac.sh
        mv sioyek-release-mac.zip sioyek-release-mac-arm.zip

    - name: Upload mac artifact
      uses: actions/upload-artifact@v4
      with:
        name: mac-arm
        path: sioyek-release-mac-arm.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac-arm]

    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('supernote-{0}', github.run_number) }}
        target_commitish: ${{ github.sha }}
        name: Sioyek with Supernote .mark support (${{ github.ref_type == 'tag' && github.ref_name || github.run_number }})
        body: |
          Unofficial build of [sioyek](https://github.com/ahrm/sioyek) with Supernote `.mark` annotation overlay support,
          built from `${{ github.sha }}`.
        files: |
          sioyek-release-windows-portable.zip
          sioyek-release-mac-arm.zip
